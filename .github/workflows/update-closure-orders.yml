name: Update NSW closure-order tracker

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: closure-order-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::curl
            any::digest
            any::dplyr
            any::jsonlite
            any::pacman
            any::purrr
            any::readr
            any::stringr
            any::testthat
            any::tibble
            any::withr
            any::xml2

      - name: Run tests
        run: Rscript tests/testthat.R

      - name: Download and archive closure orders
        run: Rscript R/01-update-closure-orders.R
        env:
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}

      - name: Build flat CSV database and save to Azure
        run: Rscript R/02-export-history.R
        env:
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}

      - name: Upload CSV database
        uses: actions/upload-artifact@v4
        with:
          name: closure-orders-csv
          path: output/02-export-history/closure-orders.csv
          if-no-files-found: error
