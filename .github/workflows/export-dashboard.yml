name: Export public dashboard history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arrow
            any::curl
            any::digest
            any::dplyr
            any::jsonlite
            any::pacman
            any::purrr
            any::readr
            any::stringr
            any::tibble
      - name: Check archive read access
        run: |
          Rscript -e 'source("R/01-update-closure-orders.R"); s <- azure_store(Sys.getenv("AZURE_STORAGE_CONTAINER_SAS_URL")); for (p in c("manifest/runs.parquet", "history/closure-orders.parquet", "current/closure-orders.parquet")) cat(p, "HEAD", s$exists(p), "GET bytes", tryCatch(length(s$read(p)), error = function(e) conditionMessage(e)), "\n"); u <- Sys.getenv("AZURE_STORAGE_CONTAINER_SAS_URL"); response <- curl::curl_fetch_memory(paste0(u, "&restype=container&comp=list")); cat("LIST status", response$status_code, "entries", lengths(regmatches(rawToChar(response$content), gregexpr("<Name>", rawToChar(response$content), fixed = TRUE))), "\n")'
        env:
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}


      - name: Export accepted history without changing Azure
        run: Rscript R/02-export-dashboard.R
        env:
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: site/data/dashboard.json
          if-no-files-found: error
